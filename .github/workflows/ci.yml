name: Rust workspace

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Test and lint (Bookworm ICU 72, pinned toolchain)
    runs-on: ubuntu-latest
    # Bookworm is the runtime ABI of the released binaries: testing on the
    # same ICU major is what makes the pin meaningful. buildpack-deps ships
    # git/curl/build-essential so actions/checkout works before apt-get.
    container: buildpack-deps:bookworm
    steps:
    - name: Check out code
      uses: actions/checkout@v7

    - name: Install ICU4C development package and provisioning tools
      run: |
        apt-get update
        apt-get install -y --no-install-recommends libicu-dev pkg-config python3 python3-venv

    # The canonical major is ICU_MAJOR (72, Bookworm). Refuse to test against
    # a host that disagrees instead of silently producing a different ABI.
    - name: Verify the ICU pin
      run: |
        want=$(tr -dc '0-9' < ICU_MAJOR)
        got=$(pkg-config --modversion icu-i18n | cut -d. -f1)
        if [ "$want" != "$got" ]; then
          echo "::error::ICU_MAJOR=$want but pkg-config reports ICU $got"
          exit 1
        fi
        echo "RUST_ICU_MAJOR_VERSION_NUMBER=$got" >> "$GITHUB_ENV"

    # The language packs are generated data: a lexicon edit must regenerate
    # them in the same change. `--check` also proves every language directory
    # has a pack, so adding a language cannot silently produce an unpacked
    # locale at runtime.
    - name: Language packs are current
      run: python3 lexicon/tools/build_language_packs.py --check

    # rust-toolchain.toml is the single toolchain pin; the explicit install
    # keeps the container from falling back to a distro or floating rustc.
    - name: Install pinned Rust toolchain
      run: |
        curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs -o /tmp/rustup-init.sh
        channel=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)
        sh /tmp/rustup-init.sh -y --no-modify-path --profile minimal \
          --default-toolchain "$channel" \
          --component rustfmt --component clippy
        echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

    # The suite fails closed when a language profile declares a UDPipe
    # treebank but its model is absent (visualner/tests/language_profiles.rs).
    # The 234 MB model set is a provisioned fixture, not repository content:
    # cache it and let the installer download only what is missing.
    - name: Cache UDPipe models
      uses: actions/cache@v4
      with:
        path: ~/.local/share/visualner/models
        key: udpipe-models-2.5-191206-v2

    - name: Install UDPipe models
      run: ./visualner/tools/install_udpipe_models.sh

    - name: cargo fmt (check)
      run: cargo fmt --all -- --check

    - name: cargo clippy (warnings are errors)
      run: cargo clippy --workspace --all-targets --locked -- -D warnings

    - name: cargo test (workspace)
      run: cargo test --workspace --locked

    - name: Validate the mediaexec.v1 contract
      run: |
        python3 -m venv /tmp/contract-venv
        /tmp/contract-venv/bin/pip install -q -r contract/mediaexec.v1/requirements.txt
        /tmp/contract-venv/bin/python contract/mediaexec.v1/validate.py

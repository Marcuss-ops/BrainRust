[workspace]
resolver = "2"
members = ["pipelinegen-muscles", "visualner", "semantic-core", "semantic-engine", "mediasampler", "ndjson-stdio"]

# Single source of truth for shared dependency versions. Member crates
# reference these with `serde = { workspace = true }` so a version bump
# lands everywhere at once instead of drifting per crate.
[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
ndjson-stdio = { path = "ndjson-stdio" }
semantic-core = { path = "semantic-core" }

# Shared lint baseline: every member opts in with `[lints] workspace = true`.
# `unsafe_code = deny` locks the safe-Rust invariant (no `unsafe` blocks in
# the workspace); rustc/clippy default-warn lints stay as warnings locally
# and CI enforces zero warnings with `cargo clippy -- -D warnings`.
[workspace.lints.rust]
unsafe_code = "deny"

# Release size/speed tuning (2026-10-27): the shipped binaries are small
# deterministic CLI tools (16M range), dominated by ICU4C + UDPipe native
# code. Thin LTO + single codegen unit + symbol stripping trims ~10-20%
# off the release binaries with no source change. Debug info is stripped
# from the binary but CI still runs un-stripped dev builds, so backtraces
# in tests are unaffected.
[profile.release]
strip = true
lto = "thin"
codegen-units = 1

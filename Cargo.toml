[workspace]
resolver = "2"
members = ["pipelinegen-muscles", "visualner", "semantic-core", "semantic-engine", "mediasampler", "ndjson-stdio", "overlay-compiler", "script-qa"]
# `imagecatalog` was RETIRED on 2026-11-18 (TICKET-28, 13b decision): it was an
# offline experiment with no production consumer and a second catalog-policy
# implementation. Its shared policy fixture moved to
# refactored/internal/capabilities/images/entitycatalog/testdata/ where the
# surviving Go test owns it. The crate directory is gone.

# Single source of truth for shared dependency versions. Member crates
# reference these with `serde = { workspace = true }` so a version bump
# lands everywhere at once instead of drifting per crate.
[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
# `float_roundtrip` is load-bearing for the media ranker parity gate: without
# it the JSON parser can land 1 ULP off the decimal literal, so the same
# `0.48500000000000004` crossing the Go→Rust wire would compute a different
# final score. Exact parsing keeps cross-language scores bit-identical.
serde_json = { version = "1", features = ["float_roundtrip"] }
thiserror = "2"
ndjson-stdio = { path = "ndjson-stdio" }
semantic-core = { path = "semantic-core" }
overlay-compiler = { path = "overlay-compiler" }
script-qa = { path = "script-qa" }

# Shared lint baseline: every member opts in with `[lints] workspace = true`.
# `unsafe_code = deny` locks the safe-Rust invariant (no `unsafe` blocks in
# the workspace); rustc/clippy default-warn lints stay as warnings locally
# and CI enforces zero warnings with `cargo clippy -- -D warnings`.
[workspace.lints.rust]
unsafe_code = "deny"

# Release size/speed tuning (2026-10-27): the shipped binaries are small
# deterministic CLI tools (16M range), dominated by ICU4C + UDPipe native
# code. Thin LTO + single codegen unit + symbol stripping trims ~10-20%
# off the release binaries with no source change. Debug info is stripped
# from the binary but CI still runs un-stripped dev builds, so backtraces
# in tests are unaffected.
[profile.release]
strip = true
lto = "thin"
codegen-units = 1

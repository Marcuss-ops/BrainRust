# Cargo configuration for the Rust workspace (semantic pipeline).
#
# The canonical ICU4C major is `ICU_MAJOR` (72: the Debian Bookworm runtime
# that executes the release binaries). The CI and release workflows assert
# that `pkg-config` reports the same major; this file is the local default and
# must be bumped together with `ICU_MAJOR`.
#
# `[env]` values are used only when the variable is NOT already set in the
# environment, so an explicit RUST_ICU_MAJOR_VERSION_NUMBER still wins for a
# deliberate cross-build (see README "Local check").
#
# RUST_ICU_LINK_SEARCH_DIR is read by rust_icu_sys when it emits -licuuc,
# -licui18n and -licudata. The ad-hoc local host may have the ICU 72 runtime
# installed while the unversioned libicuuc.so still points at ICU 70 (Ubuntu
# 22.04 is the common case). The linker scripts in icu72-link redirect those
# unversioned names to the canonical .so.72 sonames, so a plain `cargo test`
# uses the same ABI as the release binaries. The path is workspace-relative;
# the loader finds the .so.72 sonames through the normal ldconfig cache.

[env]
# rust_icu_sys (feature `icu_version_in_env`) links the matching
# libicuuc/libicui18n. Must equal ICU_MAJOR.
RUST_ICU_MAJOR_VERSION_NUMBER = "72"
RUST_ICU_LINK_SEARCH_DIR = { value = ".cargo/icu72-link", relative = true }

# Optional local build acceleration (2026-10-27, not enforced so a fresh
# checkout builds without extra tools):
#
#   cargo install sccache && export RUSTC_WRAPPER=sccache
#     caches the ICU4C/UDPipe C++ compilation across rebuilds.
#
#   sudo apt install mold  +  RUSTFLAGS="-C link-arg=-fuse-ld=mold"
#     links the 385M target/ directory 2-5x faster.
#
#   cargo install cargo-nextest && cargo nextest run --workspace
#     parallel test runner for the visualner/semantic-engine suites.

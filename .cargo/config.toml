# Cargo configuration for the Rust workspace (semantic pipeline).
#
# The canonical ICU4C major is `ICU_MAJOR` (72: the Debian Bookworm runtime
# that executes the release binaries). The CI and release workflows assert
# that `pkg-config` reports the same major; this file is the local default and
# must be bumped together with `ICU_MAJOR`.
#
# `[env]` values are used only when the variable is NOT already set in the
# environment, so a host with a different ICU must export
# RUST_ICU_MAJOR_VERSION_NUMBER explicitly (see README "Local check").
#
# LD_LIBRARY_PATH points at the Debian/Ubuntu multiarch directory where the
# system libicuuc.so.72 lives; the loader needs it when ICU is not in a
# standard path.

[env]
# rust_icu_sys (feature `icu_version_in_env`) links the matching
# libicuuc/libicui18n. Must equal ICU_MAJOR.
RUST_ICU_MAJOR_VERSION_NUMBER = "72"
LD_LIBRARY_PATH = "/usr/lib/x86_64-linux-gnu"

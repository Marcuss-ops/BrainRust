[package]
name = "imagecatalog"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "imagecatalog"
path = "src/main.rs"

[dependencies]
semantic-engine = { path = "../semantic-engine" }
semantic-core = { path = "../semantic-core" }
ndjson-stdio = { path = "../ndjson-stdio" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }

# Standalone package: excluded from the workspace root, so workspace
# inheritance is not available here. Keep the lint invariant explicit.
[lints.rust]
unsafe_code = "deny"

[workspace]

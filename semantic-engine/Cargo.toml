[package]
name = "semantic-engine"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "semantic-engine"
path = "src/main.rs"

[dependencies]
# Single NER/temporal/numeric extractor. Reused as a library, not as a
# second process, so the script is analysed once per scene.
visualner = { path = "../visualner" }
semantic-core = { workspace = true }
overlay-compiler = { workspace = true }
script-qa = { workspace = true }
ndjson-stdio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# SHA-256 for the persistent cache content address. The wire fingerprint stays
# FNV-1a; this wider hash only names on-disk entries.
sha2 = "0.10"
# Scene-local pure analysis runs in parallel; the identity registry and every
# cross-scene pass stay sequential and deterministic.
rayon = "1"

[build-dependencies]
# Build identity for the persistent cache key (see build.rs).
sha2 = "0.10"

[lints]
workspace = true
